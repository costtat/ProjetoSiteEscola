<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro de Estudos - ENEM</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --text-color: #e1e1e6;
            --primary: #00b37e;
            --primary-hover: #00875f;
            --danger: #f75a68;
            --highlight: #e1e1e6;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #a9a9b2;
        }

        .select-container {
            margin-bottom: 30px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 2px solid #29292e;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
        }

        .display-materia {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            min-height: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer {
            font-size: 5.5rem;
            font-weight: bold;
            font-family: monospace;
            margin: 20px 0;
            color: var(--highlight);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-start {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-start:hover {
            background-color: var(--primary-hover);
        }

        .btn-pause {
            background-color: #7c7c8a;
            color: #fff;
        }

        .btn-reset {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-reset:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Foco nos Estudos</h1>
        
        <div class="select-container">
            <select id="materiaSelect" onchange="atualizarMateria()">
                <option value="Selecione uma matéria">-- Escolha a Matéria Atual --</option>
                <option value="Matemática">Matemática</option>
                <option value="Gramática / Literatura">Gramática / Literatura</option>
                <option value="Redação">Redação</option>
                <option value="História">História</option>
                <option value="Geografia">Geografia</option>
                <option value="Biologia">Biologia</option>
                <option value="Física">Física</option>
                <option value="Química">Química</option>
                <option value="Filosofia / Sociologia">Filosofia / Sociologia</option>
                <option value="Língua Estrangeira">Língua Estrangeira</option>
                <option value="Revisão / Questões">Revisão / Questões</option>
            </select>
        </div>

        <div class="display-materia" id="materiaDestaque">Selecione uma matéria</div>
        <div class="timer" id="timerDisplay">50:00</div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="iniciarCronometro()">Iniciar</button>
            <button class="btn-pause" id="pauseBtn" onclick="pausarCronometro()" style="display: none;">Pausar</button>
            <button class="btn-reset" onclick="resetarCronometro()">Reiniciar</button>
        </div>
    </div>

    <script>
        let tempoInicial = 50 * 60; // 50 minutos em segundos
        let tempoRestante = tempoInicial;
        let intervalo = null;

        const timerDisplay = document.getElementById('timerDisplay');
        const materiaSelect = document.getElementById('materiaSelect');
        const materiaDestaque = document.getElementById('materiaDestaque');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        function atualizarMateria() {
            materiaDestaque.textContent = materiaSelect.value;
        }

        function formatarTempo(segundos) {
            const mins = Math.floor(segundos / 60).toString().padStart(2, '0');
            const segs = (segundos % 60).toString().padStart(2, '0');
            return `${mins}:${segs}`;
        }

        function atualizarDisplay() {
            timerDisplay.textContent = formatarTempo(tempoRestante);
        }

        function iniciarCronometro() {
            if (intervalo !== null) return;

            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';

            intervalo = setInterval(() => {
                if (tempoRestante > 0) {
                    tempoRestante--;
                    atualizarDisplay();
                } else {
                    clearInterval(intervalo);
                    intervalo = null;
                    alert("Fim da aula! Hora de um descanso.");
                    resetarCronometro();
                }
            }, 1000);
        }

        function pausarCronometro() {
            clearInterval(intervalo);
            intervalo = null;
            startBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'none';
        }

        function resetarCronometro() {
            pausarCronometro();
            tempoRestante = tempoInicial;
            atualizarDisplay();
        }

        // Inicializa o display com 50:00
        atualizarDisplay();
    </script>
</body>
</html>
